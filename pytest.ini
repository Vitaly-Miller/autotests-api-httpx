# Pytest configuration file
[pytest]

#=================================================== Run flags =========================================================
# Automatically add flags when running tests (pytest ↲)
addopts = -s -v

# Save Allure report (clean before run)
#addopts = -s -v --alluredir=./allure-results --clean-alluredir

#=================================================== Find test =========================================================
# Test files (default)
python_files = test_*.py *_test.py

# Test classes (default)
python_classes = Test*

# Test functions (methods) (default)
python_functions = test_*


#=================================================== Markers ===========================================================
# Custom markers (⚠️to avoid <PytestUnknownMarkWarning ========= warnings summary ========>)
markers =
    smoke:       Smoke tests
    regression:  Regression tests
    negative:    Negative tests
    -----------
    users:       User-related tests
    auth:        Authentication-related tests (Log in)
    files:       File-related tests
    courses:     Course-related tests
    exercises:   Exercise-related tests


#                                                     ⬇︎ OR ⬇︎
#============================================ Warnings ignore (BAD PRACTICE)============================================
# Ignore warnings (PytestWarning)
filterwarnings =
#    ignore::pytest.PytestUnknownMarkWarning


#=================================================== Logging ===========================================================
# Format of records pytest captures from logging (these are what Allure attaches to the report - log section)
log_format =  %(levelname)s | %(name)s: %(message)s

#=======================================================================================================================
