# Workflow
name: API tests

# Events
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Jobs
jobs:
  #==================================================== Job 1: Tests ===================================================
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone
      - name: Check out repository
        uses: actions/checkout@v7      # https://github.com/actions/checkout

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v6  # https://github.com/actions/setup-python
        with:
          python-version: '3.13'       # https://github.com/actions/setup-python

      # 3. API Server
      - name: Clone test server repository
        run: git clone https://github.com/Vitaly-Miller/autotests-api-server.git  # API Server

      # 4. API server dependencies
      - name: Install test server dependencies
        run: pip install -r autotests-api-server/requirements.txt

      # 5. Launch API server
      - name: Start a test server
        env:
          APP_HOST: "http://localhost:8000"
          DATABASE_URL: "sqlite+aiosqlite:///./local.db"
          JWT_ALGORITHM: "HS256"
          JWT_SECRET_KEY: "autotests-api-server-secret-key"
          JWT_ACCESS_TOKEN_EXPIRE: 1800
          JWT_REFRESH_TOKEN_EXPIRE: 5184000
        run: uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir ./autotests-api-server > server.log 2>&1 &

      # 6. Project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6.1. Check server is running
      - name: Wait for test server
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/docs > /dev/null && echo "✅ Server is up" && exit 0
            sleep 2
          done
          echo "❌ Server failed to start. Log:" && cat server.log && exit 1

      # 6.2. OpenAPI spec
      - name: Download OpenAPI spec
        run: curl -sf http://localhost:8000/openapi.json -o openapi.json

      # 7. Run tests + generate Allure results
      - name: Run API tests with pytest and generate Allure results
        run: pytest --alluredir=allure-results

      # 8. Coverage history
      - name: Restore Coverage history
        uses: actions/cache/restore@v6               # https://github.com/actions/cache
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}
          restore-keys: coverage-history-            # If there is no exact match, take the last saved history

      # 9. Swagger coverage tool
      - name: Generate Coverage report
        run: swagger-coverage-tool save-report

      # 10. Cache Coverage history
      - name: Cache Coverage history
        if: always()
        uses: actions/cache/save@v6                  # v6 — like in Restore Coverage history
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}

      # 11. Coverage report
      - name: Upload Coverage report
        if: always()
        uses: actions/upload-artifact@v7             # https://github.com/actions/upload-artifact
        with:
          name: coverage-report
          path: coverage.html

      # 12. Allure results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7             # https://github.com/actions/upload-artifact
        with:
          name: allure-results
          path: allure-results

      # 13. OpenAPI-spec artifact
      - name: Upload Swagger UI files
        if: always()
        uses: actions/upload-artifact@v7             # https://github.com/actions/upload-artifact
        with:
          name: swagger-ui
          path: |
            openapi.json
            docs/swagger.html


  #=============================================== Job 2: Publish report ===============================================
  publish-report:
    needs: [ run-tests ]
    runs-on: ubuntu-latest

    steps:
      # 1. Allure history
      - name: Get Allure history
        uses: actions/checkout@v7                     # https://github.com/actions/checkout
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 2. Artifacts downloading
      - name: Download Allure results
        uses: actions/download-artifact@v8            # https://github.com/actions/download-artifact
        with:
          name: allure-results
          path: allure-results

      # 3. Coverage-report downloading
      - name: Download Coverage report
        uses: actions/download-artifact@v8            # https://github.com/actions/download-artifact
        with:
          name: coverage-report
          path: .

      # 3.1. Swagger UI downloading
      - name: Download Swagger UI files
        uses: actions/download-artifact@v8            # https://github.com/actions/download-artifact
        with:
          name: swagger-ui
          path: .

      # 4. Allure Report history
      - name: Generate Allure Report with history
        uses: simple-elf/allure-report-action@master  # https://github.com/simple-elf/allure-report-action
        with:
          allure_results: allure-results
          allure_history: allure-history

      # 5. Add Coverage report
      - name: Add Coverage report to GitHub Pages
        run: sudo cp coverage.html allure-history/coverage.html

      # 5.1. Add Swagger UI
      - name: Add Swagger UI to GitHub Pages
        run: |
          sudo cp docs/swagger.html allure-history/swagger.html
          sudo cp openapi.json allure-history/openapi.json

      # 5.2. Safety step: Remove any possible broken .git inside allure-history
      - name: Clean stray .git from publish dir
        if: always()
        run: sudo rm -rf allure-history/.git

      # 6. Deploy Allure report
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4           # https://github.com/peaceiris/actions-gh-pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

#=======================================================================================================================
